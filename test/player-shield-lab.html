<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主机护盾图鉴</title>
<style>body{background:#080e19;color:#d9e5ef;font:14px system-ui;margin:24px}main{max-width:900px;margin:auto}#grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}section{background:#101927;border:1px solid #2c3b4e;border-radius:10px;padding:12px;text-align:center}canvas{width:100%;height:auto}h2{font-size:14px}p{color:#9ab2c4}@media(max-width:500px){#grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style>
<main><h1>主机护盾 · 三种轮廓</h1><p>游隼：分段圆环 / 壁垒：装甲六边形 / 灵翼：双翼弧盾。下方刻度表示护盾层数，装饰不改变碰撞范围。</p><div id="grid"></div></main>
<script src="../js/core.js"></script><script src="../js/logic.js"></script><script src="../js/bosses.js"></script><script src="../js/entities.js"></script><script src="../js/render.js"></script>
<script>DFJ.Render.init();const cells=[];for(const ship of DFJ.Logic.SHIPS)for(let shield=0;shield<=3;shield++){const el=document.createElement('section'),c=document.createElement('canvas'),title=document.createElement('h2');c.width=200;c.height=160;title.textContent=ship.name+' · SHIELD '+shield;el.append(c,title);document.getElementById('grid').append(el);cells.push({c,p:{ship:ship.id,shield,x:50,y:36}});}function draw(t){for(const {c,p} of cells){const g=c.getContext('2d');g.clearRect(0,0,200,160);g.save();g.scale(2,2);DFJ.Render.drawPlayer(g,p,t/1000);g.restore();}requestAnimationFrame(draw);}requestAnimationFrame(draw);</script></html>
