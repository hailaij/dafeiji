<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>敌机美术规范 · NEON STRIKE</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:28px;background:#080e19;color:#d9e5ef;font:14px system-ui,sans-serif}main{max-width:1000px;margin:auto}h1{font-size:26px;margin:8px 0}p{color:#93a6ba;line-height:1.7}.eyebrow{color:#60d0de;font-size:11px;letter-spacing:3px}#enemies,#bosses,#roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:20px 0}.card{background:#101927;border:1px solid #2c3b4e;border-radius:10px;padding:12px;overflow:hidden}.card canvas{display:block;width:100%;height:auto}h2{font-size:14px;margin:8px 0 0}.role{font-size:12px;color:#90a4b8}#roster{grid-template-columns:repeat(3,minmax(0,1fr))}label{display:inline-flex;gap:8px;align-items:center;color:#b9ccd9}button{padding:8px 12px;border:1px solid #3a5870;background:#152437;color:#dcf4ff;border-radius:6px;margin-left:12px}@media(max-width:450px){body{padding:16px}#enemies{grid-template-columns:repeat(2,minmax(0,1fr))}#bosses,#roster{grid-template-columns:1fr}}
</style><main><div class="eyebrow">NEON STRIKE / ART STUDY 01</div><h1>识别轮廓，再判断威胁</h1><p>暗色装甲 · 窄边光 · 武器与支援标识。每格左侧为 2× 细节，右侧为游戏原始大小。虚线仅供碰撞范围检查。</p><label><input id="hit" type="checkbox">显示碰撞圆</label><button id="gray">切换灰度</button><div id="enemies"></div><h1>移动堡垒 · 状态语言</h1><p>封闭装甲 → 炮口蓄力 → 开舱装填 → 断裂炮座。侧翼连接梁属于装饰，核心与炮台为可命中区域。</p><div id="bosses"></div><h1>全 Boss 图鉴 · 三种状态</h1><p>每个 Boss 依次展示待机、蓄力与二阶段装填。装饰结构不新增碰撞或弱点。</p><div id="roster"></div></main>
<script src="../js/core.js"></script><script src="../js/logic.js"></script><script src="../js/bosses.js"></script><script src="../js/entities.js"></script><script src="../js/render.js"></script><script>
const R=DFJ.Render,E=DFJ.Entities,L=DFJ.Logic;R.init();
const entries=[['grunt','突击机','窄箭形 / 快速识别'],['sine','游弋机','折翼 / 横向游走'],['diver','俯冲者','尖矛 / 前向冲刺'],['weaver','织网者','错位弯翼 / 蛇形'],['gunner','射手机','炮座 / 单管'],['sniper','狙击手','细长炮管 / 瞄准'],['tank','重装机','肩甲 / 厚重'],['bomber','轰炸机','双弹舱 / 范围攻击'],['splitter','分裂母体','双舱 / 可分离'],['mirror','镜像机','对称双片 / 紫色'],['phantom','幽灵机','碎片 / 非对称'],['guardian','护盾支援机','盾形 / 双翼发生器'],['healer','治疗机','圆盘 / 绿色十字'],['transport','补给运输机','横向货舱 / 黄色灯带']];
function card(host,title,role){const el=document.createElement('section');el.className='card';const c=document.createElement('canvas');c.width=240;c.height=130;el.append(c);const h=document.createElement('h2');h.textContent=title;el.append(h);const p=document.createElement('span');p.className='role';p.textContent=role;el.append(p);document.getElementById(host).append(el);return c;}
const cells=entries.map(x=>({type:x[0],canvas:card('enemies',x[1],x[2])}));
const states=['装甲闭合','蓄力预警','开舱装填','二阶段 · 双炮损毁'];const bosses=states.map(x=>card('bosses',x,''));
function circle(c,x,y,r){c.save();c.strokeStyle='#c1d3e4';c.setLineDash([3,3]);c.lineWidth=1;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.stroke();c.restore();}
function drawBase(){const hit=document.getElementById('hit').checked;cells.forEach(o=>{const c=o.canvas.getContext('2d');c.clearRect(0,0,240,130);const e=E.spawnEnemy(o.type,390,L.difficulty(1,'normal'));c.save();c.translate(75,65);c.scale(2,2);R.drawC(c,R.sprite(o.type),0,0);if(hit)circle(c,0,0,e.r);c.restore();R.drawC(c,R.sprite(o.type),190,65);if(hit)circle(c,190,65,e.r);});bosses.forEach((canvas,i)=>{const c=canvas.getContext('2d');c.clearRect(0,0,240,130);const b=E.spawnBoss(390,{kind:'fortress',bossHp:200});b.x=120;b.y=62;b.t=1;b.phase=i===3?2:1;b.recovery=i===2?1:0;if(i===1){b.pending={warning:1};b.fireCd=.2;}if(i===3)b.turrets.forEach(t=>t.hp=0);R.drawFortress(c,b);if(hit){circle(c,b.x,b.y,b.r);b.turrets.forEach(t=>{const pos=L.turretPosition(b,t);if(t.hp>0)circle(c,pos.x,pos.y,t.r);});}});}
const roster=[];L.BOSS_ROSTER.forEach(entry=>{['待机','蓄力','二阶段装填'].forEach((state,i)=>{roster.push({kind:entry.id,state:i,canvas:card('roster',entry.name,state)});});});
function draw(){drawBase();const hit=document.getElementById('hit').checked;roster.forEach(o=>{const ctx=o.canvas.getContext('2d');ctx.clearRect(0,0,240,130);const b=E.spawnBoss(390,{kind:o.kind,bossHp:200});b.x=120;b.y=62;b.t=1;b.phase=o.state===2?2:1;b.recovery=o.state===2?1:0;if(o.state===1){b.pending={warning:1};b.fireCd=.2;}R.drawBoss(ctx,b);if(hit)circle(ctx,b.x,b.y,b.r);});}
document.getElementById('hit').onchange=draw;document.getElementById('gray').onclick=()=>document.querySelector('main').classList.toggle('gray');const css=document.createElement('style');css.textContent='.gray canvas{filter:grayscale(1)}';document.head.append(css);draw();
</script></html>
